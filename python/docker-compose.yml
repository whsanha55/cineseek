# cineseek 로컬 인프라 — Qdrant만 컨테이너로 관리
# PG(SoT)는 공유 인프라 reins-postgres-1 컨테이너의 cineseek DB 사용
#   접속: localhost:5432, db=cineseek, user=cineseek, pw=cineseek
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cineseek-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
