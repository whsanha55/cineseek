# 서버: SQL 로그 끄기. 수집은 기준별 250페이지(명작+최신 합쳐 약 1만 편 후보)
spring:
  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: warn

cineseek:
  tmdb:
    pages: ${TMDB_PAGES:250}
  embedding:
    batch-size: 16  # 서버 CPU bge-m3로 16개 ≈ 40s. 64개면 수 분
    read-timeout: 10m  # CPU 경합·검색 요청 대기로 16개도 2분을 넘길 때가 있다 — 한 번의 지연으로 대량 재색인이 죽지 않게
