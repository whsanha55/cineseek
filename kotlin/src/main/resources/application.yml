# 공통 설정 — 주소·비밀값은 환경변수로만 받는다 (profile은 compose에서 SPRING_PROFILES_ACTIVE로 지정)
spring:
  application:
    name: cineseek
  config:
    import: optional:file:.env[.properties]  # IDE/bootRun용 — 작업 디렉터리(kotlin/)의 .env. 컨테이너엔 없음(compose env_file)
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:cineseek}
    username: ${PG_USER:jjong}
    password: ${PG_PASSWORD:jjong}
  jpa:
    open-in-view: false  # 트랜잭션 밖 지연 로딩 금지 — 필요한 연관은 fetch join·@EntityGraph로 한 번에
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100  # 자식(director·cast, 복합키) insert 배치 — movie는 IDENTITY라 배치 불가
        order_inserts: true
  task:
    scheduling:
      pool:
        size: 3  # 수집 틱·일일 틱·사용자 요청 틱 — 기본 1이면 25분짜리 틱 뒤에서 사용자 요청이 기다린다

logging:
  pattern:
    correlation: "[%X{requestId:-}] "  # RequestIdFilter가 MDC에 넣은 요청 ID

cineseek:
  collect:
    enabled: ${CINESEEK_COLLECT_ENABLED:false}  # 수집 스케줄러 활성
    interval: 30m  # 수집 틱 주기 (초기 집중 수집)
    user-request-interval: 10s  # 사용자 요청(인물 페이지 조회) 필모 수집 주기 — 정기 틱과 별도 스레드에서 돈다
    batch-size: 100  # 틱당 최대 작업 수
    max-runtime: 25m  # 한 틱 최대 실행 시간 — 도달하면 체크포인트 남기고 다음 틱에 이어서
    concurrency: 4  # 상세 수집 동시성
    lease-timeout: 30m  # 만료 RUNNING 회수 임계 — max-runtime보다 길게 (실행 중인 작업 lease가 회수되지 않게)
    retry-base: 60s  # 재시도 백오프 기본 (base * 2^attempts + 지터)
    retry-max-attempts: 8
    kr:
      years-back: 30  # 오늘 기준 수집 연도 범위
      page-cap: 400  # 구간당 페이지 상한 — 도달 시 반분할
      min-window-months: 1
    # 시드 인물 TMDB id (콤마 구분) — 기본: 송강호·전도연·최민식·이병헌·마동석·박보검·김태리·이정재·하정우·김윤석. 빈 값이면 끈다
    seed-person-ids: ${CINESEEK_COLLECT_SEED_PERSON_IDS:20738,20737,64880,25002,1024395,587634,1537768,73249,75913,75912}
    filmo-ttl-days: 30
    detail-refresh-days: 90  # 개봉일이 최근 N일 안이거나 개봉 예정인 영화는 일일 증분마다 상세(투표 수·평점 등)를 다시 받는다
    daily-cron: "0 0 4 * * *"  # 일일 증분 배치 시각
    zone: Asia/Seoul  # 구간 계산 기준 타임존
  embedding:
    base-url: ${EMBED_URL:http://localhost:8001}
    batch-size: 64          # /embed 요청 분할 단위 (계약: 1회 최대 64개)
  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}  # OpenAI 호환 엔드포인트 루트
    api-key: ${LLM_API_KEY:}  # 비어 있으면 분위기 태깅 배치를 건너뛴다 (컨테이너 주입은 compose env_file)
    model: ${LLM_MODEL:gpt-4o-mini}
    read-timeout: 180s  # 인물 소개 번역은 3천 자 안팎이라 응답에 1분이 넘게 걸리기도 한다
  tmdb:
    base-url: https://api.themoviedb.org/3
    access-token: ${TMDB_ACCESS_TOKEN:}
    language: ko-KR
    pages: ${TMDB_PAGES:50} # discover 페이지 수 (페이지당 20건 → 기본 ~1000건)
  qdrant:
    grpc-url: ${QDRANT_GRPC_URL:localhost:6334}  # java 클라이언트는 gRPC만 제공
    collection: ${QDRANT_COLLECTION:movies}
  job: ${CINESEEK_JOB:}  # eval / reindex — 플래그가 있을 때만 해당 Runner가 돌고 종료
