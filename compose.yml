# 공통 서비스 정의 — 로컬/서버 차이는 compose.local.yml / compose.prod.yml 덮어쓰기로만
name: gonamu-cineseek   # 고유 프로젝트명 — 다른 compose 프로젝트와 이름 충돌·중복 실행 방지

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gonamu-cineseek-qdrant
    volumes:
      - gonamu_qdrant_data:/qdrant/storage

  # embed (python/, bge-m3) — CPU 고정. 모델(~2GB)은 named volume에 캐시
  embed:
    build:
      context: ./python
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DEVICE: cpu   # Docker는 MPS 불가 — 서버(CPU)와 같은 조건
    volumes:
      - gonamu_embed_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s   # 첫 기동 시 모델 다운로드(~2GB) 감안

  api:
    build:
      context: ./kotlin
    environment:
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-cineseek}
      PG_USER: ${PG_USER:-jjong}
      PG_PASSWORD: ${PG_PASSWORD:-jjong}
      QDRANT_URL: http://qdrant:6333     # 디버깅/대시보드용 REST (python 기준 비교 스크립트)
      QDRANT_GRPC_URL: qdrant:6334       # Kotlin 클라이언트는 gRPC 사용
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-movies}
      EMBED_URL: http://embed:8001
    env_file:
      - path: ./kotlin/.env   # TMDB_ACCESS_TOKEN 등 비밀값 (없어도 기동은 됨)
        required: false
    depends_on:
      qdrant:
        condition: service_started
      embed:
        condition: service_healthy

volumes:
  gonamu_qdrant_data:
  gonamu_embed_models:
